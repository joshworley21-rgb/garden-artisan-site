<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@300..700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=Karla:wght@300..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <!-- Turns on the scroll-reveal animation before the first paint, so there
         is no flash of already-placed content. scripts/prerender.mjs strips the
         class from the static HTML it writes, which is what keeps every section
         visible for a reader or a crawler without JavaScript. -->
    <script>document.documentElement.classList.add('reveal-on');</script>
    <!-- Preload the poster the page will actually use: an upright phone gets the
         portrait crop from <picture>, so preloading the landscape set there
         fetched 92 KB that was never displayed and delayed the real one. -->
    <link
      rel="preload"
      as="image"
      media="(orientation: portrait) and (max-width: 700px)"
      href="/assets/jw-hero-clip-portrait-608.webp"
      imagesrcset="/assets/jw-hero-clip-portrait-456.webp 456w, /assets/jw-hero-clip-portrait-608.webp 608w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      media="(orientation: landscape), (min-width: 701px)"
      href="/assets/jw-hero-clip-poster-1024.webp"
      imagesrcset="/assets/jw-hero-clip-poster-480.webp 480w, /assets/jw-hero-clip-poster-768.webp 768w, /assets/jw-hero-clip-poster-1024.webp 1024w, /assets/jw-hero-clip-poster-1440.webp 1440w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Per-page title, description, canonical, robots, Open Graph and Twitter
         tags come from src/components/Seo.tsx. Do not add them here as well:
         react-helmet-async appends rather than replaces, so a static copy shows
         up as a second, wrong tag on every other page. The title is the one
         exception — Helmet replaces it. -->
    <title>JW Garden Services | Gardeners in Aylesbury, Bucks</title>
    <meta name="author" content="JW Garden Services" />
    <!-- Matches the chalk page ground so the browser chrome does not fight it. -->
    <meta name="theme-color" content="#ecede7" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <meta name="geo.region" content="GB-BKM" />
    <meta name="geo.placename" content="Bierton, Aylesbury" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://jw-gardenservices.co.uk/#website",
            "url": "https://jw-gardenservices.co.uk/",
            "name": "JW Garden Services",
            "inLanguage": "en-GB",
            "publisher": { "@id": "https://jw-gardenservices.co.uk/#business" }
          },
          {
            "@type": ["LocalBusiness", "LandscapingBusiness"],
            "@id": "https://jw-gardenservices.co.uk/#business",
            "name": "JW Garden Services",
            "url": "https://jw-gardenservices.co.uk/",
            "description": "Garden maintenance, garden design and hard landscaping in Aylesbury and the surrounding areas of Buckinghamshire, Bedfordshire and Hertfordshire.",
            "image": "https://jw-gardenservices.co.uk/assets/og/default.jpg",
            "logo": "https://jw-gardenservices.co.uk/assets/jw-logo.png",
            "email": "info@jw-gardenservices.co.uk",
            "telephone": "+447950636954",
            "priceRange": "££",
            "currenciesAccepted": "GBP",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bierton, Aylesbury",
              "addressRegion": "Buckinghamshire",
              "addressCountry": "GB"
            },
            "geo": { "@type": "GeoCoordinates", "latitude": 51.8339, "longitude": -0.7869 },
            "sameAs": [
              "https://www.google.com/maps/search/?api=1&query=JW%20Garden%20Services%20Bierton%20Aylesbury",
              "https://www.google.com/search?kgmid=/g/11gnsg7505&q=JW+Garden+Services",
              "https://aylesbury.info/list/directory/jw-garden-services/",
              "https://jwgardenservices.freeindex.co.uk/"
            ],
            "areaServed": [
              { "@type": "City", "name": "Aylesbury" },
              { "@type": "City", "name": "Bierton" },
              { "@type": "City", "name": "Buckingham" },
              { "@type": "City", "name": "Tring" },
              { "@type": "City", "name": "Waddesdon" },
              { "@type": "City", "name": "Stone" },
              { "@type": "City", "name": "Wing" },
              { "@type": "City", "name": "Haddenham" },
              { "@type": "City", "name": "Leighton Buzzard" },
              { "@type": "City", "name": "Chesham" },
              { "@type": "City", "name": "Amersham" },
              { "@type": "City", "name": "Great Missenden" }
            ],
            "openingHoursSpecification": [
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
                "opens": "08:00",
                "closes": "16:00"
              }
            ],
            "knowsAbout": ["Garden maintenance", "Garden design", "Hard landscaping"],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Garden services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Garden maintenance", "description": "Regular mowing, hedge cutting, pruning, weeding and seasonal borders." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Garden design and planting", "description": "Planting plans and garden redesign tailored to your space." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hard landscaping", "description": "Patios, paths, fencing, decking and turfing." } }
              ]
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
