<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="preload"
      as="image"
      href="/assets/jw-hero-clip-poster-720.webp"
      imagesrcset="/assets/jw-hero-clip-poster-720.webp 720w, /assets/jw-hero-clip-poster-1280.webp 1280w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <!-- Per-page title, description, canonical, robots, Open Graph and Twitter
         tags come from src/components/Seo.tsx. Do not add them here as well:
         react-helmet-async appends rather than replaces, so a static copy shows
         up as a second, wrong tag on every other page. The title is the one
         exception — Helmet replaces it. -->
    <title>JW Garden Services | Gardeners in Aylesbury, Bucks</title>
    <meta name="author" content="JW Garden Services" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <meta name="geo.region" content="GB-BKM" />
    <meta name="geo.placename" content="Bierton, Aylesbury" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.jw-gardening.com/#website",
            "url": "https://www.jw-gardening.com/",
            "name": "JW Garden Services",
            "inLanguage": "en-GB",
            "publisher": { "@id": "https://www.jw-gardening.com/#business" }
          },
          {
            "@type": ["LocalBusiness", "LandscapingBusiness"],
            "@id": "https://www.jw-gardening.com/#business",
            "name": "JW Garden Services",
            "url": "https://www.jw-gardening.com/",
            "description": "Garden maintenance, garden design and hard landscaping in Aylesbury and the surrounding areas of Buckinghamshire, Bedfordshire and Hertfordshire.",
            "image": "https://www.jw-gardening.com/assets/og/default.jpg",
            "logo": "https://www.jw-gardening.com/assets/jw-logo.png",
            "email": "Jw_gardenservices@yahoo.com",
            "telephone": "+447950636954",
            "priceRange": "££",
            "currenciesAccepted": "GBP",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Bierton, Aylesbury",
              "addressRegion": "Buckinghamshire",
              "addressCountry": "GB"
            },
            "geo": { "@type": "GeoCoordinates", "latitude": 51.8339, "longitude": -0.7869 },
            "sameAs": [
              "https://www.google.com/maps/search/?api=1&query=JW%20Garden%20Services%20Bierton%20Aylesbury",
              "https://www.google.com/search?kgmid=/g/11gnsg7505&q=JW+Garden+Services"
            ],
            "areaServed": [
              { "@type": "City", "name": "Aylesbury" },
              { "@type": "City", "name": "Bierton" },
              { "@type": "City", "name": "Buckingham" },
              { "@type": "City", "name": "Tring" },
              { "@type": "City", "name": "Waddesdon" },
              { "@type": "City", "name": "Stone" },
              { "@type": "City", "name": "Wing" },
              { "@type": "City", "name": "Haddenham" },
              { "@type": "City", "name": "Leighton Buzzard" },
              { "@type": "City", "name": "Chesham" },
              { "@type": "City", "name": "Amersham" },
              { "@type": "City", "name": "Great Missenden" }
            ],
            "openingHoursSpecification": [
              {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
                "opens": "08:00",
                "closes": "16:00"
              }
            ],
            "knowsAbout": ["Garden maintenance", "Garden design", "Hard landscaping"],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Garden services",
              "itemListElement": [
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Garden maintenance", "description": "Regular mowing, hedge cutting, pruning, weeding and seasonal borders." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Garden design and planting", "description": "Planting plans and garden redesign tailored to your space." } },
                { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Hard landscaping", "description": "Patios, paths, fencing, decking and turfing." } }
              ]
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
